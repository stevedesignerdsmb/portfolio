<!doctype html><html><head><meta charset="utf-8"><title>og studio</title>
<!-- Source of src/app/opengraph-image.jpg: a GLSL satin shader + type, drawn at 1200x630.
     To re-render: copy into public/, open it on the dev server, screenshot or save the canvas, export as JPEG. -->
<style>html,body{margin:0;background:#000}canvas{display:block}#out{width:1200px;height:630px}</style></head>
<body><canvas id="out" width="1200" height="630"></canvas>
<script>
const W=1200,H=630,S=2; // render at 2x then downsample for smooth gradients
const gl_c=document.createElement('canvas'); gl_c.width=W*S; gl_c.height=H*S;
const gl=gl_c.getContext('webgl',{preserveDrawingBuffer:true});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;
uniform vec2 R; uniform float T;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<4;i++){v+=a*n(p);p=m*p;a*=.5;}return v;}
float field(vec2 p){
 vec2 q=vec2(fbm(p+vec2(0.,T)),fbm(p+vec2(5.2,1.3)));
 vec2 r=vec2(fbm(p+2.4*q+vec2(1.7,9.2)),fbm(p+2.4*q+vec2(8.3,2.8)));
 return fbm(p+2.2*r);
}
void main(){
 vec2 uv=gl_FragCoord.xy/R; vec2 p=(gl_FragCoord.xy-.5*R)/R.y;
 p=mat2(.8,-.6,.6,.8)*p*vec2(.55,1.25)+vec2(.3,.1); // stretch into long folds, tilted
 float e=1.5/R.y;
 float f=field(p);
 float fx=field(p+vec2(e,0.))-field(p-vec2(e,0.));
 float fy=field(p+vec2(0.,e))-field(p-vec2(0.,e));
 vec3 N=normalize(vec3(-fx,-fy,e*3.2));
 vec3 L=normalize(vec3(.55,.65,.55));
 vec3 V=vec3(0.,0.,1.);
 float dif=max(dot(N,L),0.);
 float spec=pow(max(dot(reflect(-L,N),V),0.),14.);
 float sheen=pow(1.-max(N.z,0.),1.6);
 float lum=.05+.30*dif*dif+.95*spec+.25*sheen;
 // keep the lower left quiet for the type
 float quiet=smoothstep(.05,.85,uv.x+.45*uv.y-.1);
 lum*=mix(.1,1.,quiet*quiet);
 vec3 base=vec3(.047,.047,.055);
 vec3 col=base+vec3(.95,.95,.97)*lum;
 // one quiet Fina-green glint in the sheen
 col+=vec3(0.,.86,.2)*sheen*spec*.9*quiet;
 col*=1.-.28*pow(length(uv-vec2(.7,.6)),2.);
 gl_FragColor=vec4(col,1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),W*S,H*S);gl.uniform1f(gl.getUniformLocation(pr,'T'),+(new URLSearchParams(location.search).get('t')||1.7));
gl.viewport(0,0,W*S,H*S);gl.drawArrays(gl.TRIANGLES,0,3);

async function compose(){
  const c=document.getElementById('out').getContext('2d');
  c.imageSmoothingQuality='high'; c.drawImage(gl_c,0,0,W,H);
  // film grain
  const id=c.getImageData(0,0,W,H),d=id.data;
  for(let i=0;i<d.length;i+=4){const g=(Math.random()-.5)*10;d[i]+=g;d[i+1]+=g;d[i+2]+=g;}
  c.putImageData(id,0,0);
  await document.fonts.load('600 80px Inter'); await document.fonts.load('400 26px Inter');
  const X=80;
  // mark { •‿• }
  c.save(); c.translate(X,70); c.scale(2,2);
  c.fillStyle='rgba(255,255,255,.4)'; c.font='400 17px Inter'; c.fillText('{',4,15.5); c.textAlign='right'; c.fillText('}',36,15.5); c.textAlign='left';
  c.fillStyle='#f7f7f8'; c.beginPath(); c.ellipse(15.5,8.6,1.5,1.7,0,0,7); c.fill(); c.beginPath(); c.ellipse(24.5,8.6,1.5,1.7,0,0,7); c.fill();
  c.strokeStyle='#f7f7f8'; c.lineWidth=1.4; c.lineCap='round'; c.beginPath(); c.moveTo(16.4,12.6); c.quadraticCurveTo(20,15.4,23.6,12.6); c.stroke(); c.restore();
  c.fillStyle='#f7f7f8'; c.font='600 84px Inter'; c.letterSpacing='-3px'; c.fillText('Steve Calderon',X-4,452);
  c.fillStyle='rgba(247,247,248,.5)'; c.fillText('Design Engineer',X-4,540);
  c.letterSpacing='0px'; c.font='400 24px Inter'; c.fillStyle='rgba(247,247,248,.55)';
  c.textAlign='right'; c.fillText('stevedesignerd.com',W-80,107);
  document.title='ready';
}
compose();

</script></body></html>
